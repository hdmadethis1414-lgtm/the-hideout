<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>partners · bare names + icons (url)</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0b0f17;
            font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            display: flex;
            justify-content: center;
            padding: 2.5rem 1rem;
            color: #f0f4fa;
        }

        .container {
            max-width: 1200px;
            width: 100%;
        }

        .header {
            margin-bottom: 3rem;
        }

        .header h1 {
            font-size: 2.5rem;
            font-weight: 500;
            letter-spacing: -0.5px;
            color: #dbe4f0;
            border-left: 3px solid #4f7df3;
            padding-left: 1.2rem;
        }

        /* grid — super simple, just names + images */
        .partners-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 2rem;
        }

        /* card: minimal, only what matters */
        .partner-card {
            background: #141d2b;
            border-radius: 20px;
            padding: 2rem 1rem 1.5rem 1rem;
            text-align: center;
            border: 1px solid #26334d;
            transition: border 0.1s ease;
        }

        .partner-card:hover {
            border-color: #5675c9;
        }

        /* image: you change src via url — nothing else */
        .partner-card img {
            width: 96px;
            height: 96px;
            object-fit: contain;  /* keeps any icon shape, no distortion */
            display: block;
            margin: 0 auto 1.2rem auto;
            background: #1f2b3c;
            border-radius: 28px;
            padding: 10px;
            border: 1px solid #374d74;
        }

        /* name only — no tags, no desc, no extra fluff */
        .partner-card .name {
            font-size: 1.5rem;
            font-weight: 500;
            color: #ffffff;
            line-height: 1.3;
        }

        /* subtle note (barely there) */
        .instruction-note {
            margin-top: 3rem;
            text-align: center;
            color: #5f739b;
            font-size: 0.9rem;
            border-top: 1px solid #20293b;
            padding-top: 2rem;
        }

        .instruction-note code {
            background: #1b2537;
            padding: 0.2rem 0.7rem;
            border-radius: 40px;
            color: #9bb4ff;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>partners</h1>
        </div>

        <!-- GRID — only names + icons via URL (you replace src) -->
        <div class="partners-grid">

            <!-- 1. game hub — replace icon url -->
            <div class="partner-card">
                <img src="https://placehold.co/96x96/1e2a3c/6d8cff?text=GH" alt="partner icon">
                <div class="name">Game Hub</div>
            </div>

            <!-- 2. retro zone — change image url -->
            <div class="partner-card">
                <img src="https://placehold.co/96x96/1e2a3c/6d8cff?text=Retro" alt="partner icon">
                <div class="name">Retro Zone</div>
            </div>

            <!-- 3. unblocked world — different placeholder, you can replace with any .png/.jpg/.svg -->
            <div class="partner-card">
                <img src="https://placehold.co/96x96/1e2a3c/ffaa66?text=UBW" alt="partner icon">
                <div class="name">Unblocked World</div>
            </div>

            <!-- 4. pixel arcade -->
            <div class="partner-card">
                <img src="https://placehold.co/96x96/1e2a3c/aaff99?text=Pixel" alt="partner icon">
                <div class="name">Pixel Arcade</div>
            </div>

            <!-- 5. monkey games (just name + img url) -->
            <div class="partner-card">
                <img src="https://placehold.co/96x96/1e2a3c/ff99cc?text=Monkey" alt="partner icon">
                <div class="name">Monkey Games</div>
            </div>

            <!-- 6. classic zone -->
            <div class="partner-card">
                <img src="https://placehold.co/96x96/1e2a3c/99ddff?text=Classic" alt="partner icon">
                <div class="name">Classic Zone</div>
            </div>

            <!-- 7. speed arcade (extra) -->
            <div class="partner-card">
                <img src="https://placehold.co/96x96/1e2a3c/ff8866?text=Speed" alt="partner icon">
                <div class="name">Speed Arcade</div>
            </div>

            <!-- 8. pocket play -->
            <div class="partner-card">
                <img src="https://placehold.co/96x96/1e2a3c/aaccff?text=Pocket" alt="partner icon">
                <div class="name">Pocket Play</div>
            </div>

        </div>

        <!-- minimalist reminder: change the src attribute -->
        <div class="instruction-note">
            <code>☝️ each img src = your own icon URL (png, gif, svg, jpg)</code><br>
            <span style="opacity:0.5; font-size:0.8rem;">just names & icons — nothing else</span>
        </div>
    </div>
</body>
</html>
